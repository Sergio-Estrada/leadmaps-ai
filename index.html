<!-- Dentro del panel o chat de tu HTML -->
<div class="agente-ia-container" id="agenteContainer">
    <div class="agente-header" onclick="toggleChat()">
        <span>🧠 Agente Gemini - Asesor IA</span>
        <button id="btnToggleChat">▼</button>
    </div>
    
    <div class="agente-body" id="agenteBody">
        <div class="agente-chat" id="chatGuru">
            <div class="msg-ia">🤖 Hola, soy tu agente Gemini. Puedes escribirme o pulsar el micrófono para hablarme.</div>
        </div>

        <div class="agente-input-area">
            <input type="text" id="preguntaAgente" placeholder="Escribe o usa la voz..." onkeypress="handleKeyPress(event)">
            <button onclick="escucharVoz()" id="btnMic" title="Hablar por micrófono">🎙️</button>
            <button onclick="enviarAGemini()" class="btn-enviar">Enviar</button>
        </div>
    </div>
</div>
